<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Піксельне місто</title>
<style>
:root{--bg:#161a23;--frame:#0f1218;color-scheme:dark}
*{box-sizing:border-box}
html,body{width:100%;height:100%;height:100dvh;margin:0;overflow:hidden}
body{background:var(--bg);position:relative;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;position:absolute;inset:0;width:100vw;height:100vh;height:100dvh;image-rendering:pixelated;image-rendering:crisp-edges;background:var(--frame)}
#phoneBtn{position:fixed;z-index:7;right:max(72px,calc(env(safe-area-inset-right) + 72px));top:max(12px,env(safe-area-inset-top));height:48px;padding:0 13px;border:1px solid #ffffff55;border-radius:13px;background:#171c28dd;color:#fff;font:700 14px system-ui;box-shadow:0 4px 14px #0007}
#phone{display:none;position:fixed;z-index:20;inset:0;background:#080d18ee;color:#fff;font:14px system-ui;padding: max(18px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom));}
#phone.open{display:flex;align-items:center;justify-content:center}
.phoneShell{width:min(390px,94vw);height:min(720px,90dvh);border:7px solid #303746;border-radius:30px;background:#121b2b;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 18px 60px #000b}
#phoneMap{flex:1;min-height:180px;border:2px solid #71839a;border-radius:12px;background:repeating-linear-gradient(0deg,#273e38 0 18px,#344b42 18px 20px),repeating-linear-gradient(90deg,transparent 0 24px,#8a9690 24px 27px);position:relative;overflow:hidden}
#phoneMap:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 47%,#59616b 47% 53%,transparent 53%),linear-gradient(0deg,transparent 46%,#59616b 46% 54%,transparent 54%);opacity:.9}
#phoneMap:after{content:"ТВОЄ МІСТО · НАВЧАЛЬНА КАРТА";position:absolute;left:8px;top:8px;font-size:10px;color:#dce6ef;background:#172334cc;padding:5px;border-radius:5px}
#phoneClose{height:44px;border:0;border-radius:12px;background:#426b9b;color:white;font-weight:800}
#fullscreen{position:fixed;z-index:5;top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));width:48px;height:48px;border:1px solid #ffffff55;border-radius:13px;background:#171c28dd;color:#fff;font-size:25px;box-shadow:0 4px 14px #0007}
#hint{position:fixed;z-index:4;top:max(14px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));padding:9px 12px;border:1px solid #ffffff35;border-radius:10px;background:#171c28c9;color:#fff;font:12px system-ui,sans-serif;pointer-events:none}
#joystick{position:fixed;z-index:5;left:max(20px,env(safe-area-inset-left));bottom:max(20px,env(safe-area-inset-bottom));width:142px;height:142px;border:2px solid #ffffff55;border-radius:50%;background:#171c28a8;box-shadow:inset 0 0 22px #0007,0 4px 14px #0006;touch-action:none;display:grid;place-items:center}
#stick{width:58px;height:58px;border:2px solid #ffffff99;border-radius:50%;background:linear-gradient(145deg,#71839d,#28364b);box-shadow:0 4px 12px #0009;pointer-events:none;transform:translate(0,0)}
#joystick:after{content:'';position:absolute;inset:12px;border:1px dashed #ffffff25;border-radius:50%;pointer-events:none}
@media(max-width:420px){#joystick{width:126px;height:126px}#stick{width:54px;height:54px}}
#action{position:fixed;z-index:6;right:max(18px,env(safe-area-inset-right));bottom:max(20px,env(safe-area-inset-bottom));min-width:112px;height:64px;padding:0 16px;border:2px solid #ffffff75;border-radius:16px;background:linear-gradient(180deg,#e4a83b,#a96619);color:#fff;font:800 15px system-ui,sans-serif;letter-spacing:.4px;text-shadow:0 2px 2px #61370b;box-shadow:0 5px 16px #0008;touch-action:manipulation}
#action:active{transform:translateY(2px);filter:brightness(1.12)}
#action.ready{background:linear-gradient(180deg,#45bd79,#147446)}
#hint{max-width:calc(100vw - 80px)}
#pad button{width:52px;height:52px}
@media(max-width:420px){#pad{grid-template-columns:repeat(3,46px);grid-template-rows:repeat(2,46px)}#pad button{width:46px;height:46px}#action{min-width:100px;height:58px;font-size:14px;right:12px}}
@media(max-height:430px){#pad{bottom:8px;grid-template-columns:repeat(3,42px);grid-template-rows:repeat(2,42px)}#pad button{width:42px;height:42px}#action{bottom:10px;height:52px}}
#phoneContent{overflow:auto;flex:1;min-height:0;display:flex;flex-direction:column;gap:9px}.appGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.appBtn,.gameBtn{border:1px solid #52657d;border-radius:12px;background:#26374d;color:#fff;padding:12px 7px;font:700 13px system-ui;min-height:48px}.gameBtn{min-height:42px;text-align:left;padding:10px 12px;background:#26364a}.appCard{background:#1b293b;border:1px solid #40536c;border-radius:12px;padding:12px;line-height:1.45}.appTitle{font-size:17px;font-weight:900;margin-bottom:5px}.appRow{display:flex;gap:8px;flex-wrap:wrap}.appRow .gameBtn{flex:1}#phoneBack{height:40px;border:1px solid #60738a;border-radius:10px;background:#314963;color:white;font-weight:800}#cashHud{position:fixed;z-index:4;right:12px;top:70px;padding:8px 11px;border:1px solid #ffffff40;border-radius:10px;background:#101923d9;color:#a7f2b3;font:800 13px system-ui;pointer-events:none}@media(max-width:420px){.phoneShell{padding:13px}.appBtn{font-size:12px;padding:9px 4px}}
</style>
</head>
<body>
<canvas id="c" aria-label="Піксельне місто з будинками, під'їздами, машинами та персонажем"></canvas>
<div id="hint">Джойстик — рух / авто · ДІЯ — сісти, зайти або взаємодіяти</div>
<div id="joystick" aria-label="Джойстик керування"><div id="stick"></div></div>
<button id="action" type="button">ДІЯ</button>
<button id="phoneBtn" type="button">📱 ТЕЛЕФОН</button>
<div id="cashHud">💵 $250</div>
<div id="cashHud">💵 $250</div>
<div id="cashHud">💵 $250</div>
<div id="phone" aria-hidden="true"><div class="phoneShell"><div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:20px">📱 МІЙ ТЕЛЕФОН</b><span id="phoneClock">12:00</span></div><div id="phoneContent"></div><button id="phoneBack" type="button">НА ГОЛОВНУ</button><button id="phoneClose" type="button">ЗАКРИТИ</button></div></div>
<button id="fullscreen" aria-label="На весь екран" title="На весь екран">⛶</button>
<script>
(function(){
const T=16,W=70,H=60,PW=W*T,PH=H*T;
const cv=document.getElementById('c');cv.width=PW;cv.height=PH;
const ctx=cv.getContext('2d');
const st=document.createElement('canvas');st.width=PW;st.height=PH;
const g=st.getContext('2d');
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=mulberry(11);
const ri=(a,b)=>a+Math.floor(R()*(b-a+1));
const pick=a=>a[Math.floor(R()*a.length)];
const rect=(c,x,y,w,h,col)=>{c.fillStyle=col;c.fillRect(Math.round(x),Math.round(y),w,h)};

const roadX=Array.from({length:6},(_,i)=>[9+i*10,10+i*10]).flat();
const roadY=Array.from({length:5},(_,i)=>[9+i*10,10+i*10]).flat();
const RX=roadX,RY=roadY;
const isRoad=(x,y)=>RX.includes(x)||RY.includes(y);
const isInter=(x,y)=>RX.includes(x)&&RY.includes(y);
function nearRoad(x,y){for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){const a=x+i,b=y+j;if(a>=0&&b>=0&&a<W&&b<H&&isRoad(a,b))return true}return false}

/* ground */
for(let y=0;y<H;y++)for(let x=0;x<W;x++){
 const X=x*T,Y=y*T;
 if(isRoad(x,y)){
  rect(g,X,Y,T,T,'#3a3e49');
  for(let k=0;k<7;k++)rect(g,X+ri(0,14),Y+ri(0,14),2,1,'#444955');
 }else if(nearRoad(x,y)){
  rect(g,X,Y,T,T,'#bdb8aa');
  rect(g,X,Y+T-1,T,1,'#aaa597');rect(g,X+T-1,Y,1,T,'#aaa597');
  const nb=[[0,-1],[0,1],[-1,0],[1,0]];
  nb.forEach(([a,b])=>{const nx=x+a,ny=y+b;if(nx>=0&&ny>=0&&nx<W&&ny<H&&isRoad(nx,ny)){
   if(a===0)rect(g,X,b<0?Y:Y+T-2,T,2,'#d9d4c5');else rect(g,a<0?X:X+T-2,Y,2,T,'#d9d4c5');}});
 }else{
  rect(g,X,Y,T,T,'#5a9a48');
  for(let k=0;k<6;k++)rect(g,X+ri(0,14),Y+ri(0,14),2,1,R()<.5?'#67a954':'#4f8a40');
 }
}
/* road markings */
for(let x=0;x<PW;x+=8)if(!RX.includes(Math.floor(x/T)))rect(g,x,10*T-1,4,2,'#d9c46a');
for(const bx of roadX.filter((_,i)=>i%2===1))for(let y=0;y<PH;y+=8)if(!RY.includes(Math.floor(y/T)))rect(g,bx*T-1,y,2,4,'#d9c46a');
for(const cx of roadX.filter((_,i)=>i%2===0)){
 for(const tx of [cx-1,cx+2])for(const ty of RY)for(let k=0;k<4;k++)rect(g,tx*T+1,ty*T+1+k*4,14,2,'#e6e3d8');
 for(const ty of roadY.filter((_,i)=>i%2===0).map(v=>v-1))for(const tx of [cx,cx+1])for(let k=0;k<4;k++)rect(g,tx*T+1+k*4,ty*T+1,2,14,'#e6e3d8');
}

/* occupancy + items */
const occ=Array.from({length:H},()=>Array(W).fill(false));
const items=[];
const mark=(x,y,w,d)=>{for(let j=y;j<y+d;j++)for(let i=x;i<x+w;i++)if(occ[j]&&occ[j][i]!==undefined)occ[j][i]=true};

function tree(cx,by,s){
 items.push({y:by,draw:()=>{
  rect(g,cx-1,by-5,2,5,'#5a3b2a');
  rect(g,cx-4,by-1,8,2,'rgba(0,0,0,.25)');
  const r=s||6,ccy=by-9;
  for(let j=-r;j<=r;j++)for(let i=-r;i<=r;i++){
   const dd=i*i+j*j;if(dd>r*r)continue;
   const col=(i+j<-r*0.6)?'#4f9a43':(i+j>r*0.5?'#2f6b34':'#3d8239');
   rect(g,cx+i,ccy+j,1,1,col);
  }
  rect(g,cx-2,ccy-3,2,1,'#7bc15a');
 }});
}
const wins=['#ffd86b','#3b5470'];
function win(x,y,w,h){
 const lit=R()<.28;
 rect(g,x-1,y-1,w+2,h+2,'#6e6a60');
 rect(g,x,y,w,h,lit?'#ffd86b':'#3b5470');
 if(!lit)rect(g,x,y,1,1,'#7fa2c4');
}
const DIG={1:['.#.','##.','.#.','.#.','###'],2:['##.','..#','.#.','#..','###'],3:['##.','..#','.##','..#','##.'],4:['#.#','#.#','###','..#','..#'],5:['###','#..','##.','..#','##.']};
function digit(x,y,n){DIG[n].forEach((row,j)=>{for(let i=0;i<3;i++)if(row[i]==='#')rect(g,x+i,y+j,1,1,'#2a2d34')})}

const houseWalls=[['#e8d9b0','#c9b88a'],['#dfae9f','#b88477'],['#a9c4d6','#869fb3'],['#cfd6a2','#a7ae7b']];
const houseRoofs=[['#a8483a','#c4604f','#7f3329'],['#4f6b8a','#6a88a9','#3a5069'],['#6b5b4b','#85735f','#4d4034'],['#3f7a56','#56976e','#2d5a3f']];
const aptWalls=[['#cfc9bb','#a9a394'],['#b9ccd8','#92a8b6'],['#d8c6b4','#b3a28f'],['#c6d3b5','#9eac8c']];

function house(x,y,w,d){
 const Hh=12,X=x*T,Y=y*T,Wd=w*T,Dp=d*T,wl=pick(houseWalls),rf=pick(houseRoofs),wy=Y+Dp-Hh;
 items.push({y:Y+Dp,draw:()=>{
  const dx=X+Math.floor(Wd/2)-2;
  rect(g,dx,Y+Dp,5,T,'#cfc8b2');
  rect(g,X+1,wy,Wd-2,Hh,wl[0]);rect(g,X+1,wy+Hh-1,Wd-2,1,wl[1]);
  rect(g,dx,wy+Hh-7,5,7,'#5a3b2a');rect(g,dx+3,wy+Hh-4,1,1,'#e8c15a');
  rect(g,dx-1,wy+Hh,7,1,'#9a958a');
  win(X+6,wy+3,5,4);win(X+Wd-11,wy+3,5,4);
  const rx=X-2,ry=Y-Hh,rw=Wd+4,rh=Dp+2,rj=Math.floor(rh*.4);
  for(let j=0;j<rh;j++){
   let col=j<rj?rf[2]:(Math.floor((j-rj)/4)%2?rf[0]:rf[1]);
   if(j===rj)col='#d8d0c0';
   rect(g,rx,ry+j,rw,1,col);
  }
  for(let j=2;j<rj;j+=4)rect(g,rx,ry+j,rw,1,'rgba(0,0,0,.18)');
  rect(g,rx,ry,1,rh,'rgba(0,0,0,.2)');rect(g,rx+rw-1,ry,1,rh,'rgba(0,0,0,.2)');
  rect(g,rx,ry+rh-1,rw,2,'rgba(0,0,0,.35)');
  rect(g,rx+rw-14,ry+3,5,9,'#8a5a4a');rect(g,rx+rw-15,ry+3,7,2,'#5d3a30');
 }});
}
function flatRoof(X,Y,Wd,Dp,Hh,vents){
 const rx=X-1,ry=Y-Hh,rw=Wd+2,rh=Dp+1;
 rect(g,rx,ry,rw,rh,'#8b8e96');
 rect(g,rx+2,ry+2,rw-4,rh-4,'#5f636c');
 rect(g,rx+2,ry+2,rw-4,1,'#767a84');
 rect(g,rx,ry+rh,rw,1,'rgba(0,0,0,.3)');
 for(let k=0;k<vents;k++){const vx=rx+6+Math.floor(R()*(rw-18)),vy=ry+6+Math.floor(R()*(rh-14));rect(g,vx,vy,6,5,'#a8acb4');rect(g,vx,vy+4,6,1,'#7d818a');rect(g,vx+1,vy+1,4,2,'#8e929b')}
 return {rx,ry,rw,rh};
}
function apt(x,y,w,d){
 const Hh=16,X=x*T,Y=y*T,Wd=w*T,Dp=d*T,wl=pick(aptWalls),wy=Y+Dp-Hh;
 const n=w>=6?3:2;
 const doors=[];for(let k=0;k<n;k++)doors.push(X+Math.floor(Wd*(k+.5)/n)-3);
 items.push({y:Y+Dp,draw:()=>{
  rect(g,X,wy,Wd,Hh,wl[0]);rect(g,X,wy+Hh-1,Wd,1,wl[1]);
  for(let sx=T;sx<Wd;sx+=T)rect(g,X+sx,wy,1,Hh,wl[1]);
  for(let wx=X+4;wx<X+Wd-5;wx+=10)for(const fy of [2,10]){
   if(doors.some(dd=>wx>dd-6&&wx<dd+15)&&fy===10)continue;
   if(doors.some(dd=>wx>dd-6&&wx<dd+15)&&fy===2&&false)continue;
   win(wx,wy+fy,4,4);
  }
  doors.forEach((dd,i)=>{
   rect(g,dd,wy+7,6,9,'#3d4650');rect(g,dd+1,wy+8,4,7,'#7ea3b8');rect(g,dd+3,wy+8,1,7,'#3d4650');
   rect(g,dd-2,wy+5,10,2,'#7a3b32');rect(g,dd-2,wy+7,10,1,'rgba(0,0,0,.3)');
   rect(g,dd+8,wy+8,5,7,'#f2f2ea');digit(dd+9,wy+9,i+1);
  });
  const r=flatRoof(X,Y,Wd,Dp,Hh,3);
  doors.forEach(dd=>{rect(g,dd+2,r.ry+r.rh-18,10,8,'#9a9ea6');rect(g,dd+2,r.ry+r.rh-18,10,2,'#b6bac2')});
 }});
}
function shop(x,y,w,d){
 const Hh=16,X=x*T,Y=y*T,Wd=w*T,Dp=d*T,wy=Y+Dp-Hh;
 const c1=pick(['#c8453a','#2f7fb0','#3a9a5b','#d89a2a']);
 items.push({y:Y+Dp,draw:()=>{
  rect(g,X,wy,Wd,Hh,'#a85a44');
  for(let j=0;j<Hh;j+=3)rect(g,X,wy+j,Wd,1,'#8c4636');
  rect(g,X+4,wy,Wd-8,4,c1);for(let k=0;k<Wd-12;k+=4)rect(g,X+6+k,wy+1,2,2,'#f2f2ea');
  for(let k=0;k<Wd;k+=4)rect(g,X+k,wy+4,4,4,(k/4)%2?'#f2f2ea':c1);
  rect(g,X,wy+8,Wd,1,'rgba(0,0,0,.3)');
  rect(g,X+3,wy+9,Wd/2-8,6,'#7ea3b8');rect(g,X+Wd/2+5,wy+9,Wd/2-8,6,'#7ea3b8');
  rect(g,X+Wd/2-3,wy+9,6,7,'#3d4650');rect(g,X+Wd/2-2,wy+10,4,6,'#9bc0d4');
  const r=flatRoof(X,Y,Wd,Dp,Hh,2);
 }});
}
function park(x,y,w,d){
 const X=x*T,Y=y*T,Wd=w*T,Dp=d*T;
 items.push({y:Y+2,draw:()=>{
  rect(g,X,Y,Wd,Dp,'#6eb35a');
  for(let k=0;k<14;k++)rect(g,X+ri(0,Wd-2),Y+ri(0,Dp-1),2,1,'#7ec468');
  rect(g,X+Wd/2-3,Y,6,Dp,'#cfc8b2');
  rect(g,X+4,Y+Dp-18,22,12,'#3f86c4');rect(g,X+5,Y+Dp-17,20,2,'#6db0e6');
  rect(g,X+Wd-22,Y+Dp-10,12,3,'#7a5a3a');rect(g,X+Wd-22,Y+Dp-7,2,3,'#4d3824');rect(g,X+Wd-12,Y+Dp-7,2,3,'#4d3824');
 }});
 tree(X+8,Y+14,6);tree(X+Wd-9,Y+Dp-14,6);tree(X+Wd-10,Y+16,5);
 mark(x,y,w,d);
}
function fillRow(x0,x1,y){
 let x=x0;
 while(x1-x+1>=3){
  const rem=x1-x+1;const o=[];
  if(rem>=5){o.push('apt','apt')}
  if(rem>=3){o.push('house','house')}
  if(rem>=4)o.push('shop');
  if(rem>=3&&R()<.4)o.push('park');
  const t=pick(o);let w;
  if(t==='apt')w=rem>=6?ri(5,6):5;
  else if(t==='house')w=rem>=4?ri(3,4):3;
  else if(t==='shop')w=4;else w=3;
  if(t==='apt')apt(x,y,w,3);else if(t==='house')house(x,y,w,3);else if(t==='shop')shop(x,y,w,3);else park(x,y,w,3);
  if(t!=='park')mark(x,y,w,3);
  x+=w+(R()<.35?1:0);
 }
}
const BX=[[0,7],[12,17],[22,27],[32,37],[42,47],[52,57],[62,W-1]],BY=[[0,7],[12,17],[22,27],[32,37],[42,47],[52,H-1]];
for(const [x0,x1] of BX)for(const [y0,y1] of BY){
 fillRow(x0,x1,y1-2);
 if(y1-6>=y0)fillRow(x0,x1,y1-6);
}
/* free interior tiles: trees */
for(const [x0,x1] of BX)for(const [y0,y1] of BY)for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
 if(occ[y][x])continue;
 if(R()<.38)tree(x*T+ri(5,10),y*T+ri(11,15),ri(5,6));
 else if(R()<.4){const px=x*T+ri(2,12),py=y*T+ri(4,12);items.push({y:py,draw:()=>{rect(g,px,py,3,2,'#3d8239');rect(g,px,py-1,2,1,'#e8c15a')}})}
}
/* lamps */
for(const lx of [8*T+12,11*T+3,18*T+12,21*T+3])for(const ty of [3,6,14,17]){
 const ly=(ty+1)*T-2;
 items.push({y:ly,draw:()=>{rect(g,lx,ly-10,1,10,'#2d3036');rect(g,lx-1,ly-11,3,2,'#ffe9a0');rect(g,lx-1,ly-1,3,1,'#2d3036')}});
}
items.sort((a,b)=>a.y-b.y).forEach(i=>i.draw());

/* cars */
const DX=[1,0,-1,0],DY=[0,1,0,-1];
function dirsAt(x,y){const s=[];if(x%10===9)s.push(1);if(x%10===0&&x>0)s.push(3);if(y%10===9)s.push(2);if(y%10===0&&y>0)s.push(0);return s}
const colors=['#d94a3a','#2f7fd0','#f2c230','#38a85a','#e8e8e8','#8a3fb0','#f08a2a','#2c3340','#9aa3b0'];
const roads=[];for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(isRoad(x,y)&&!isInter(x,y))roads.push([x,y]);
const cars=[];

  .filter(([dx,dy])=>pedestrianTiles.has((tx+dx)+','+(ty+dy)));

 let choices=options;

  const filtered=options.filter(([dx,dy])=>dx!==p.lastDir[0]||dy!==p.lastDir[1]);
  if(filtered.length&&Math.random()<.72)choices=filtered;
 }
 const [dx,dy]=choices[Math.floor(Math.random()*choices.length)];
 p.lastDir=[dx,dy];p.targetX=(tx+dx)*T+T/2;p.targetY=(ty+dy)*T+T/2;
}
const pedestrianStarts=Array.from(pedestrianTiles,key=>key.split(',').map(Number));
for(let i=pedestrianStarts.length-1;i>0;i--){
 const j=Math.floor(Math.random()*(i+1));[pedestrianStarts[i],pedestrianStarts[j]]=[pedestrianStarts[j],pedestrianStarts[i]];
}
for(const [tx,ty] of pedestrianStarts){
 if(pedestrians.length>=56)break;

 if(pedestrians.some(p=>Math.hypot(p.x-x,p.y-y)<34))continue;

function updatePlayer(dt){
 if(indoors)return;
 if(inCar){
  // Джойстик задає бажаний напрямок руху: вправо = вправо на екрані,
  // вниз = вниз. Кут плавно наближається до напрямку джойстика.
  const jlen=Math.hypot(joyX,joyY);
  if(jlen>.22){
   const targetAngle=Math.atan2(joyY,joyX);
   let diff=((targetAngle-carAngle+Math.PI*3)%(Math.PI*2))-Math.PI;
   const maxTurn=2.8*dt;
   carAngle+=Math.max(-maxTurn,Math.min(maxTurn,diff));
   const targetSpeed=105*Math.min(1,jlen);
   driveSpeed+=Math.max(-150*dt,Math.min(150*dt,targetSpeed-driveSpeed));
  }else if(pressed.up||pressed.down||pressed.left||pressed.right){
   const steer=(pressed.right?1:0)-(pressed.left?1:0);
   if(pressed.up)driveSpeed=Math.min(105,driveSpeed+105*dt);
   else if(pressed.down)driveSpeed=Math.max(-38,driveSpeed-145*dt);
   if(steer&&Math.abs(driveSpeed)>3)carAngle+=steer*1.75*Math.min(1,Math.abs(driveSpeed)/38)*dt*(driveSpeed<0?-1:1);
  }else driveSpeed+=driveSpeed>0?-30*dt:driveSpeed<0?30*dt:0;
  if(Math.abs(driveSpeed)<1)driveSpeed=0;
  // Зберігаємо напрямок для виходу з машини та інших старих систем.
  parkedCar.d=Math.round((((carAngle%(Math.PI*2))+Math.PI*2)%(Math.PI*2))/(Math.PI/2))%4;
  if(driveSpeed){
   const nx=parkedCar.x+Math.cos(carAngle)*driveSpeed*dt;
   const ny=parkedCar.y+Math.sin(carAngle)*driveSpeed*dt;
   if(onRoad(nx,ny)){parkedCar.x=nx;parkedCar.y=ny;}
   else driveSpeed=0;
  }
  return;
 }
 let dx=(pressed.right?1:0)-(pressed.left?1:0);
 let dy=(pressed.down?1:0)-(pressed.up?1:0);
 if(!dx&&!dy)return;
 const len=Math.hypot(dx,dy);dx/=len;dy/=len;
 if(Math.abs(dx)>Math.abs(dy))player.dir=dx>0?'right':'left';
 else player.dir=dy>0?'down':'up';
 const speed=75*dt,nx=player.x+dx*speed,ny=player.y+dy*speed;
 if(canStand(nx,player.y))player.x=nx;
 if(canStand(player.x,ny))player.y=ny;

}

 let dx=e.clientX-cx,dy=e.clientY-cy;const max=r.width*.34,len=Math.hypot(dx,dy);
 if(len>max){dx=dx/len*max;dy=dy/len*max;}
 stick.style.transform=`translate(${dx}px,${dy}px)`;
 const nx=dx/max,ny=dy/max,dead=.22;
 joyX=nx;joyY=ny;
 pressed.left=nx< -dead;pressed.right=nx>dead;pressed.up=ny< -dead;pressed.down=ny>dead;
}

function travelTo(where){if(inCar){inCar=false;driveSpeed=0;}const points={center:[PW*.51,PH*.49],park:[PW*.18,PH*.78],mall:[PW*.82,PH*.28]};const q=points[where]||points.center;player.x=q[0];player.y=q[1];earn(-({center:10,park:8,mall:12}[where]||0),0);gameNotice='ТИ ПРИБУВ У НОВИЙ РАЙОН';noticeTime=2;closePhone();}
function interactPedestrian(){let best=null,dist=38;for(const p of pedestrians){const d=Math.hypot(p.x-player.x,p.y-player.y);if(d<dist){dist=d;best=p;}}return best;}
function talkToPedestrian(){if(!interactPedestrian())return false;if(!quest){const tasks=[['Передай посилку','Відвідай інший район міста',75],['Зроби покупки','Придбай будь-яку річ у магазині',55],['Прогулянка парком','Відвідай міський парк',45],['Допомога сусіду','Поговори з мешканцями ще раз',65]];const t=tasks[Math.floor(Math.random()*tasks.length)];quest={title:t[0],desc:t[1],reward:t[2],startX:player.x,startY:player.y};gameNotice='НОВЕ ЗАВДАННЯ: '+t[0];noticeTime=4;}else{earn(12,2);gameNotice='МЕШКАНЕЦЬ ПОДЯКУВАВ · +$12';noticeTime=2;}return true;}
function handlePhoneAction(e){const b=e.target.closest('button');if(!b)return;
 if(b.dataset.app){showPhoneApp(b.dataset.app);return;}
 if(b.dataset.job){gameData.job=b.dataset.job;earn(15,0);showPhoneApp('jobs');return;}
 if(b.dataset.work){const pays={'Кур’єр':35,'Таксист':50,'Працівник магазину':40,'Комунальник':45,'Медик':55,'Пожежник':60};if(pays[gameData.job]){earn(pays[gameData.job],12);gameNotice='ЗМІНУ ЗАВЕРШЕНО · +$'+pays[gameData.job];noticeTime=3;}else{gameNotice='СПОЧАТКУ ОБЕРИ ПРОФЕСІЮ';noticeTime=2;}showPhoneApp('jobs');return;}
 if(b.dataset.buy){const cost=+b.dataset.cost;if(gameData.money>=cost){gameData.money-=cost;gameData.inventory.push(b.dataset.buy);saveGame();gameNotice='КУПЛЕНО: '+b.dataset.buy;noticeTime=2;}else{gameNotice='НЕ ВИСТАЧАЄ ГРОШЕЙ';noticeTime=2;}showPhoneApp('shop');updateCashHud();return;}
 if(b.dataset.use!==undefined){const i=+b.dataset.use,item=gameData.inventory[i];if(item){if(item.includes('Сендвіч'))playerEnergy=Math.min(100,playerEnergy+25);else if(item.includes('Напій'))playerEnergy=Math.min(100,playerEnergy+15);else playerMood=Math.min(100,playerMood+10);gameData.inventory.splice(i,1);saveGame();}showPhoneApp('inventory');return;}
 if(b.dataset.home){const n=b.dataset.home,cost=+b.dataset.cost;if(gameData.ownedHomes.includes(n)){gameNotice='ЦЕ ЖИТЛО ВЖЕ ТВОЄ';noticeTime=2;}else if(gameData.money>=cost){gameData.money-=cost;gameData.ownedHomes.push(n);saveGame();gameNotice='ТЕПЕР ЦЕ ТВОЄ ЖИТЛО';noticeTime=3;}else{gameNotice='НЕ ВИСТАЧАЄ ГРОШЕЙ';noticeTime=2;}showPhoneApp('homes');updateCashHud();return;}
 if(b.dataset.travel){const cost={center:10,park:8,mall:12}[b.dataset.travel];if(gameData.money>=cost)travelTo(b.dataset.travel);else{gameNotice='НЕ ВИСТАЧАЄ ГРОШЕЙ';noticeTime=2;}return;}
 if(b.dataset.quest){if(b.dataset.quest==='daily')earn(40,10);else quest=null;showPhoneApp('quests');return;}
 if(b.dataset.setting==='save')saveGame();if(b.dataset.setting==='reset'&&confirm('Скинути весь прогрес?')){gameData={money:250,inventory:['🥪 Сендвіч'],ownedHomes:[],job:'Безробітний',level:1,xp:0,completed:0};quest=null;saveGame();updateCashHud();}showPhoneApp('settings');
}


function drawSeason(dt){seasonTimer+=dt;weatherTimer+=dt;if(seasonTimer>95){seasonTimer=0;season=['ВЕСНА','ЛІТО','ОСІНЬ','ЗИМА'][( ['ВЕСНА','ЛІТО','ОСІНЬ','ЗИМА'].indexOf(season)+1)%4];chooseWeather();}if(weatherTimer>30){weatherTimer=0;chooseWeather();}
 ctx.save();ctx.setTransform(dpr,0,0,dpr,0,0);
 if(season==='ЗИМА'){ctx.fillStyle='#dcecff18';ctx.fillRect(0,0,screenW,screenH);}else if(season==='ОСІНЬ'){ctx.fillStyle='#e8a34b0b';ctx.fillRect(0,0,screenW,screenH);}
 if(weather==='ДОЩ'||weather==='ГРОЗА'||weather==='ЗАВІРЮХА'||weather==='СНІГ'){
  for(const p of weatherParticles){p.y+=p.v*dt*(weather==='СНІГ'?.35:1);p.x+=weather==='СНІГ'?Math.sin(p.y*.03)*12:-35*dt;if(p.y>screenH+5){p.y=-5;p.x=Math.random()*screenW;}if(p.x< -5)p.x=screenW;
   ctx.fillStyle=weather==='СНІГ'?'#f4f8ffff':'#9fc9e8bb';ctx.fillRect(Math.round(p.x),Math.round(p.y),weather==='СНІГ'?3:1,weather==='СНІГ'?3:7);}}
 if(weather==='ТУМАН'){ctx.fillStyle='#c7d4d855';ctx.fillRect(0,0,screenW,screenH);}if(weather==='ГРОЗА'&&Math.random()<.006){ctx.fillStyle='#ffffff55';ctx.fillRect(0,0,screenW,screenH);}
 ctx.fillStyle='#fff';ctx.font='bold 12px system-ui';ctx.textAlign='right';ctx.fillText(season+' · '+weather,screenW-14,screenH-16);
 if(alertActive){ctx.textAlign='center';ctx.fillStyle='#ff4242';ctx.font='bold 16px system-ui';ctx.fillText('🔴 СИГНАЛ ТРИВОГИ',screenW/2,48);}
 if(tckMode){ctx.textAlign='left';ctx.fillStyle='#e9f0d4';ctx.font='bold 12px system-ui';ctx.fillText('ТЦК · затримано: '+tckCaught,12,screenH-42);}
 if(noticeTime>0){noticeTime-=dt;ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 15px system-ui';ctx.fillText(gameNotice,screenW/2,screenH*.18);}
 ctx.restore();
}
function randomDroneWaypoint(){
 // Decorative, fictional game-event location selected without player tracking.
 const spots=[];
 for(let ty=0;ty<H;ty++)for(let tx=0;tx<W;tx++)if(occ[ty][tx]&&!isRoad(tx,ty)){
  spots.push({x:tx*T+T/2,y:ty*T+T/2});
 }
 return spots[Math.floor(Math.random()*spots.length)]||{x:PW*.5,y:PH*.5};
}
function startDroneFlight(){
 // A short, purely cinematic fly-over; no real-world navigation or targeting is modeled.
 const side=Math.floor(Math.random()*4),margin=18;
 drone.x=side===0?-margin:side===1?PW+margin:Math.random()*PW;
 drone.y=side===2?-margin:side===3?PH+margin:Math.random()*PH;
 const target=randomDroneWaypoint();
 drone.targetX=target.x;drone.targetY=target.y;
 drone.heading=Math.atan2(drone.targetY-drone.y,drone.targetX-drone.x);
 drone.speed=0;drone.z=35;drone.flightTime=0;drone.active=true;
}
function randomBuildingPoint(){
 const spots=[];
 for(let ty=0;ty<H;ty++)for(let tx=0;tx<W;tx++)if(occ[ty][tx]&&!isRoad(tx,ty))spots.push({x:tx*T+T/2,y:ty*T+T/2});
 return spots[Math.floor(Math.random()*spots.length)]||{x:PW*.5,y:PH*.5};
}
function updateSpecial(dt){
 updateCityIncident(dt);
 // Random, irregular alarm timing; it is not tied to the in-game clock.
 if(alertActive){alertLeft-=dt;if(alertLeft<=0){alertActive=false;alertTimer=35+Math.random()*105;}}
 else{alertTimer-=dt;if(alertTimer<=0){alertActive=true;alertLeft=9+Math.random()*13;gameNotice='🔴 СИГНАЛ ТРИВОГИ! ЦЕ ВИГАДАНА ІГРОВА ПОДІЯ';noticeTime=5;}}
 // Random city events: a drone fly-by with a cinematic scene OR an ordinary building fire.
 cityEventTimer-=dt;
 if(cityEventTimer<=0&&!cityIncident.active&&!drone.active){
  cityEventTimer=65+Math.random()*145;
  if(Math.random()<.48){startDroneFlight();}
  else{const site=randomBuildingPoint();startCityIncident(site.x,site.y,'fire');}
 }
 if(police.active){
  const tx=inCar?parkedCar.x:player.x,ty=inCar?parkedCar.y:player.y;
  const dist=Math.hypot(tx-police.x,ty-police.y);
  if(!indoors&&dist<125){police.seen+=dt;if(police.seen>.6){gameNotice='ПАТРУЛЬ ПОМІТИВ ТЕБЕ!';noticeTime=.1;}}
  else if(indoors||dist>190)police.seen=0;
  const a=Math.atan2(ty-police.y,tx-police.x);police.angle=a;
  police.speed+=(dist<170?62:0)*dt;police.speed=Math.min(58,police.speed);
  if(!indoors&&dist<220){police.x+=Math.cos(a)*police.speed*dt;police.y+=Math.sin(a)*police.speed*dt;}
  if(dist<13&&!indoors){
   police.active=false;police.speed=0;tckMode=true;tckCaught=0;
   parkedCar.x=police.x;parkedCar.y=police.y;parkedCar.d=0;parkedCar.col='#d5d8c8';parkedCar.van=true;parkedCar.tck=true;parkedCar.visible=true;
   player.x=parkedCar.x;player.y=parkedCar.y;inCar=true;driveSpeed=0;carAngle=0;
   gameNotice='ТЕБЕ ЗАТРИМАЛИ! ТЕПЕР ТИ В КОМАНДІ ТЦК — ЛОВИ ІНШІ МАШИНИ';noticeTime=6;
  }
 }
 if(tckMode&&inCar){
  for(let i=cars.length-1;i>=0;i--){const [cx,cy]=pos(cars[i]);const d=Math.hypot(wrapd(cx-parkedCar.x,PW),wrapd(cy-parkedCar.y,PH));
   if(d<13){cars.splice(i,1);tckCaught++;gameNotice='ЗАТРИМАНО МАШИН: '+tckCaught;noticeTime=2.5;break;}
  }
 }
 if(drone.active){
  drone.flightTime+=dt;
  const dx=drone.targetX-drone.x,dy=drone.targetY-drone.y,dist=Math.hypot(dx,dy);
  if(dist<4||drone.flightTime>32){
   const impactX=drone.targetX,impactY=drone.targetY;
   drone.active=false;drone.timer=80+Math.random()*140;
   startCityIncident(impactX,impactY,'drone');
  }else{
   const desiredSpeed=34;drone.speed+=(desiredSpeed-drone.speed)*Math.min(1,dt*.8);
   const desiredHeading=Math.atan2(dy,dx);let turn=((desiredHeading-drone.heading+Math.PI*3)%(Math.PI*2))-Math.PI;
   drone.heading+=Math.max(-1.1*dt,Math.min(1.1*dt,turn));
   const step=Math.min(dist,drone.speed*dt);drone.x+=Math.cos(drone.heading)*step;drone.y+=Math.sin(drone.heading)*step;
   drone.z=35+Math.sin(drone.flightTime*1.4)*1.2;
  }
 }
}

function drawDrone(){
 if(!drone.active)return;
 const x=Math.round(drone.x),y=Math.round(drone.y),z=drone.z;
 ctx.save();
 // Compact fictional fixed-wing silhouette: about car-sized, not building-sized.
 ctx.globalAlpha=.28;ctx.fillStyle='#080b0d';ctx.fillRect(x-11,y+5,22,3);ctx.globalAlpha=1;
 ctx.translate(x,y-z*.34);ctx.rotate(drone.heading);ctx.scale(.82,.82);
 // Broad, simple delta wing and narrow fuselage; deliberately stylized game art.
 ctx.fillStyle='#090d10';ctx.beginPath();ctx.moveTo(13,0);ctx.lineTo(-9,-7);ctx.lineTo(-5,-2);ctx.lineTo(-15,-2);ctx.lineTo(-15,2);ctx.lineTo(-5,2);ctx.lineTo(-9,7);ctx.closePath();ctx.fill();
 ctx.fillStyle='#252d31';ctx.fillRect(-8,-1,18,2);ctx.fillRect(-6,-5,7,2);ctx.fillRect(-6,3,7,2);
 ctx.fillStyle='#687277';ctx.fillRect(-3,-1,10,1);
 ctx.fillStyle='#b94b38';ctx.fillRect(-12,-5,2,2);
 ctx.restore();
}

function nearestRoadPoint(x,y){
 let best=null,bd=Infinity;
 for(let ty=0;ty<H;ty++)for(let tx=0;tx<W;tx++)if(isRoad(tx,ty)){
  const px=tx*T+T/2,py=ty*T+T/2,d=Math.hypot(px-x,py-y);
  if(d<bd){bd=d;best={x:px,y:py,tx,ty};}
 }
 return best;
}
function startCityIncident(impactX,impactY,kind='drone'){
 // Scripted pixel-art cutscene: the visual effect is tied to the drone's final screen position.
 if(cityIncident.active)return;
 const site={x:Math.max(24,Math.min(PW-24,impactX)),y:Math.max(24,Math.min(PH-24,impactY))};
 cityIncident.active=true;cityIncident.kind=kind;cityIncident.x=site.x;cityIncident.y=site.y;cityIncident.age=0;cityIncident.smoke=[];cityIncident.smokeClock=0;cityIncident.rubble=[];cityIncident.blastBits=[];cityIncident.firePoints=[];
 for(let i=0;i<52;i++){
  const a=Math.random()*Math.PI*2,r=7+Math.random()*42;
  cityIncident.rubble.push({x:site.x+Math.cos(a)*r,y:site.y+Math.sin(a)*r,w:2+Math.random()*7,h:2+Math.random()*5,c:pick(['#101314','#191b1c','#292725','#403a34','#51463b','#686052'])});
 }
 if(kind==='drone')for(let i=0;i<42;i++){
  const a=Math.random()*Math.PI*2,v=22+Math.random()*75;
  cityIncident.blastBits.push({x:site.x+(Math.random()-.5)*10,y:site.y+(Math.random()-.5)*8,vx:Math.cos(a)*v,vy:Math.sin(a)*v-18,life:.65+Math.random()*.9,max:1.55,size:2+Math.random()*3,c:pick(['#17191a','#39332e','#6b6256','#d34b22','#ff9a2e','#e8c36c'])});
 }
 for(let i=0;i<6;i++)cityIncident.firePoints.push({x:site.x+(i-2.5)*8+Math.random()*5,y:site.y+Math.random()*18-5,phase:Math.random()*6});
 const road=nearestRoadPoint(site.x,site.y),horizontal=RY.includes(road.ty);
 let sx=road.x,sy=road.y;
 if(horizontal)sx=road.x<PW/2?PW+22:-22;else sy=road.y<PH/2?PH+22:-22;
 const angle=Math.atan2(road.y-sy,road.x-sx);
 cityIncident.response={x:sx,y:sy,targetX:road.x,targetY:road.y,angle,arrived:false,flash:0};
 cityIncident.workers=[];
 gameNotice=kind==='drone'?'ІГРОВА СЦЕНА: ДРОН — РЯТУВАЛЬНИКИ ВЖЕ ЇДУТЬ':'ПОЖЕЖА В БУДИНКУ — ВИКЛИКАНО ПОЖЕЖНИХ';noticeTime=5;
}
function updateCityIncident(dt){
 if(!cityIncident.active)return;
 cityIncident.age+=dt;
 const incident=cityIncident;
 if(incident.age<58){
  incident.smokeClock+=dt;
  while(incident.smokeClock>.15){incident.smokeClock-=.15;const f=pick(incident.firePoints);incident.smoke.push({x:f.x+(Math.random()-.5)*8,y:f.y-5,vx:(Math.random()-.5)*8,vy:-8-Math.random()*12,life:3.5+Math.random()*2.5,max:6,size:3+Math.random()*5});}
 }
 incident.smoke.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.995;p.life-=dt;p.size+=dt*1.5;});
 incident.smoke=incident.smoke.filter(p=>p.life>0);
 incident.blastBits.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=68*dt;p.vx*=.985;p.life-=dt;});
 incident.blastBits=incident.blastBits.filter(p=>p.life>0);
 const r=incident.response;
 if(r&&!r.arrived){const dx=r.targetX-r.x,dy=r.targetY-r.y,d=Math.hypot(dx,dy),step=Math.min(d,54*dt);if(d<2){r.arrived=true;r.x=r.targetX;r.y=r.targetY;incident.workers=[-1,0,1].map((v,i)=>({x:r.x,y:r.y,targetX:incident.x+v*10,targetY:incident.y+16+(i%2)*5,ready:false}));gameNotice='ПОЖЕЖНІ ПРИБУЛИ НА МІСЦЕ';noticeTime=3;}else{r.x+=dx/d*step;r.y+=dy/d*step;}r.flash+=dt*10;}
 incident.workers.forEach(w=>{const dx=w.targetX-w.x,dy=w.targetY-w.y,d=Math.hypot(dx,dy);if(d<1.5)w.ready=true;else{const step=Math.min(d,17*dt);w.x+=dx/d*step;w.y+=dy/d*step;}});
 if(incident.age>64){cityIncident.active=false;cityIncident.response=null;cityIncident.workers=[];}
}

 ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(-5,2,10,2);
 ctx.fillStyle='#26343a';ctx.fillRect(-4,-8,8,10);

function drawPixelBlast(q){
 const a=q.age,x=q.x,y=q.y;
 if(a<1.35){
  const grow=Math.min(1,a/.42),fade=a<.78?1:Math.max(0,1-(a-.78)/.57);
  const radius=8+grow*36;
  // Concentric chunky pixels make the blast visibly pixel-art rather than a smooth circle.
  for(let gy=-13;gy<=13;gy++)for(let gx=-13;gx<=13;gx++){
   const nx=gx/13,ny=gy/13,d=Math.sqrt(nx*nx+ny*ny);
   const jitter=((gx*17+gy*29+Math.floor(a*18)*7)%5)*.025;
   if(d<grow+jitter&&d>.18){
    ctx.globalAlpha=fade;
    ctx.fillStyle=d<.34?'#fff0a0':d<.58?'#ffbd3d':d<.82?'#f36b24':'#a92f1c';
    ctx.fillRect(Math.round(x+gx*radius/13),Math.round(y+gy*radius/13),3,3);
   }
  }
  ctx.globalAlpha=1;
  if(a>.28){
   const smokeFade=Math.min(.72,(a-.28)*.85);
   for(let i=0;i<18;i++){
    const ox=((i*23)%41)-20,oy=-22-((i*13)%22);
    ctx.globalAlpha=smokeFade*(.55+(i%3)*.12);ctx.fillStyle=i%3?'#292a29':'#111516';
    ctx.fillRect(Math.round(x+ox),Math.round(y+oy),5+(i%3)*2,5+(i%2)*3);
   }
   ctx.globalAlpha=1;
  }
 }
 q.blastBits.forEach(p=>{ctx.globalAlpha=Math.max(0,Math.min(1,p.life/p.max));ctx.fillStyle=p.c;ctx.fillRect(Math.round(p.x),Math.round(p.y),Math.round(p.size),Math.round(p.size));});
 ctx.globalAlpha=1;
 if(a<.14){ctx.save();ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle=`rgba(255,239,190,${(1-a/.14)*.42})`;ctx.fillRect(0,0,screenW,screenH);ctx.restore();}
}

 ctx.fillStyle='#6a5b49';ctx.fillRect(x-26,y-20,14,3);ctx.fillRect(x+10,y-20,15,3);ctx.fillRect(x-30,y+7,18,4);ctx.fillRect(x+11,y+10,18,3);
 ctx.fillStyle='#090c0e';ctx.fillRect(x-17,y-13,10,15);ctx.fillRect(x+3,y-12,13,13);ctx.fillRect(x-2,y+4,9,8);
 ctx.fillStyle='#34302a';ctx.fillRect(x-20,y-5,4,3);ctx.fillRect(x+19,y+2,5,4);ctx.fillRect(x-8,y+13,8,3);
 if(q.kind==='drone')drawPixelBlast(q);
 q.rubble.forEach(b=>{ctx.fillStyle=b.c;ctx.fillRect(Math.round(b.x),Math.round(b.y),Math.round(b.w),Math.round(b.h));});
 if(q.age<58){
  q.firePoints.forEach(f=>{
   const flick=Math.sin(q.age*13+f.phase),h=8+Math.abs(flick)*10;
   ctx.fillStyle='#7f2118';ctx.fillRect(Math.round(f.x-4),Math.round(f.y+2),9,4);
   ctx.fillStyle='#c7351d';ctx.fillRect(Math.round(f.x-3),Math.round(f.y-h*.55),7,Math.max(3,Math.round(h*.55)));
   ctx.fillRect(Math.round(f.x-1+flick),Math.round(f.y-h),4,Math.round(h*.45));
   ctx.fillStyle='#ff9a27';ctx.fillRect(Math.round(f.x-2),Math.round(f.y-h*.55),4,Math.round(h*.5));
   ctx.fillStyle='#ffe47b';ctx.fillRect(Math.round(f.x),Math.round(f.y-2),2,4);
  });
 }
 q.smoke.forEach(p=>{const a=Math.max(0,Math.min(.48,p.life/p.max*.48));ctx.globalAlpha=a;ctx.fillStyle='#202324';const size=Math.max(3,Math.round(p.size/2)*2);ctx.fillRect(Math.round(p.x/2)*2,Math.round(p.y/2)*2,size,size);});ctx.globalAlpha=1;

  drawFirefighter(w.x,w.y);
 });
}

 const list=cars.map(c=>{const [x,y]=pos(c);return{type:'traffic',c,x:((x%PW)+PW)%PW,y:((y%PH)+PH)%PH};});

  if(x<14)xs.push(x+PW);if(x>PW-14)xs.push(x-PW);

 });
 if(police.active){ctx.save();ctx.translate(Math.round(police.x),Math.round(police.y));ctx.rotate(police.angle);drawCar({d:0,col:'#e8edf4',van:true,tck:true},0,0);ctx.fillStyle='#e43b45';ctx.fillRect(-2,-7,4,2);ctx.fillStyle='#3988ee';ctx.fillRect(2,-7,4,2);ctx.restore();}
 explosions.forEach((e,i)=>{e.life-=dt;const r=(1-e.life/e.max)*15+3;ctx.fillStyle='#ffb52e';ctx.beginPath();ctx.arc(e.x,e.y,r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f04b27';ctx.beginPath();ctx.arc(e.x,e.y,r*.58,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffe68a';ctx.beginPath();ctx.arc(e.x,e.y,r*.25,0,Math.PI*2);ctx.fill();});

 if(indoors){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#172231';ctx.fillRect(0,0,screenW,screenH);ctx.fillStyle='#35465a';ctx.fillRect(0,0,screenW,screenH*.62);ctx.fillStyle='#735b49';ctx.fillRect(0,screenH*.62,screenW,screenH*.38);ctx.fillStyle='#8a7059';for(let x=0;x<screenW;x+=42)ctx.fillRect(x,screenH*.62,2,screenH*.38);ctx.fillStyle='#a8d1df';ctx.fillRect(screenW*.12,screenH*.16,screenW*.23,screenH*.23);ctx.strokeStyle='#e4e0d1';ctx.lineWidth=7;ctx.strokeRect(screenW*.12,screenH*.16,screenW*.23,screenH*.23);ctx.beginPath();ctx.moveTo(screenW*.235,screenH*.16);ctx.lineTo(screenW*.235,screenH*.39);ctx.moveTo(screenW*.12,screenH*.275);ctx.lineTo(screenW*.35,screenH*.275);ctx.stroke();ctx.fillStyle='#3b526b';ctx.fillRect(screenW*.55,screenH*.48,screenW*.27,screenH*.16);ctx.fillStyle='#d1b28c';ctx.fillRect(screenW*.53,screenH*.45,screenW*.31,screenH*.07);ctx.fillStyle='#4d3540';ctx.fillRect(screenW*.18,screenH*.62,screenW*.25,screenH*.1);ctx.fillStyle='#9c7959';ctx.fillRect(screenW*.2,screenH*.58,screenW*.21,screenH*.06);ctx.fillStyle='#315c42';ctx.fillRect(screenW*.82,screenH*.42,12,screenH*.2);ctx.fillStyle='#4c9b5c';ctx.beginPath();ctx.arc(screenW*.82,screenH*.4,23,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f4e8ca';ctx.textAlign='center';ctx.font='bold 22px system-ui';ctx.fillText('🏠 ІНТЕР’ЄР БУДИНКУ',screenW/2,screenH*.12);ctx.font='14px system-ui';ctx.fillText('Натисни «ВИЙТИ З ДОМУ», щоб повернутися',screenW/2,screenH*.9);}
 requestAnimationFrame(frame);
