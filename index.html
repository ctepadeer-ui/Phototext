<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Рибалка 3D</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&family=Russo+One&display=swap">
<style>
:root{
  /* layout: fullscreen 3D lake scene, HUD chips on top, one big action button docked at the bottom, shop and graphics as bottom sheets */
  --ink:#0a2233; --deep:#0f3a56; --foam:#e9f7ff; --sun:#ffb02e; --good:#49d391; --bad:#ff5b4a; --glass:rgba(8,32,48,.74); --line:rgba(233,247,255,.16);
  --font-display:'Russo One','Arial Black',system-ui,sans-serif;
  --font-body:'Nunito','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--foam);font-family:var(--font-body);font-weight:600;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer;border:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
#hud{position:fixed;left:0;right:0;top:0;display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;pointer-events:none}
.chip{background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:7px 14px;display:flex;align-items:center;gap:8px;backdrop-filter:blur(6px);font-family:var(--font-display);font-size:15px;min-width:0}
.chip .dot{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff0a8,var(--sun) 60%,#b5700c);flex:none}
.chip i{font-style:normal;background:var(--sun);color:#3a2300;border-radius:999px;padding:1px 8px;font-size:12px}
#rodname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
#catchline{position:fixed;left:12px;top:calc(env(safe-area-inset-top,0px) + 58px);font-size:13px;opacity:.9;text-shadow:0 1px 3px rgba(0,0,0,.6);pointer-events:none;max-width:70vw}
#fight{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 92px);width:min(86vw,420px);display:grid;gap:8px;pointer-events:none}
#fightmsg{font-family:var(--font-display);text-align:center;font-size:20px;text-shadow:0 2px 6px rgba(0,0,0,.7)}
#fightmsg.surge{color:var(--bad);animation:shake .18s infinite}
@keyframes shake{50%{transform:translateX(4px)}}
.bar{height:16px;border-radius:999px;background:rgba(5,20,32,.7);border:1px solid var(--line);overflow:hidden;position:relative}
.bar>div{height:100%;width:0;border-radius:999px}
#tfill{background:linear-gradient(90deg,#3cc9ff,var(--good) 55%,#ffd24a 72%,var(--bad))}
.bar.tension .zone{position:absolute;left:72.7%;right:0;top:0;bottom:0;background:repeating-linear-gradient(135deg,rgba(255,91,74,.35) 0 6px,transparent 6px 12px);pointer-events:none}
#pfill{background:linear-gradient(90deg,#ffb02e,#ffe27a)}
.barlbl{display:flex;justify-content:space-between;font-size:11px;opacity:.8;margin-top:-4px}
#card{position:fixed;left:50%;top:34%;transform:translate(-50%,-50%);background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:14px 22px;text-align:center;backdrop-filter:blur(8px);pointer-events:none;min-width:200px}
#card b{font-family:var(--font-display);font-size:22px;display:block}
#card span{display:block;font-size:14px;opacity:.9;margin-top:2px}
#card em{font-style:normal;color:var(--sun);font-family:var(--font-display);font-size:18px;display:block;margin-top:6px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 110px);transform:translateX(-50%) translateY(10px);background:var(--glass);border:1px solid var(--line);padding:8px 16px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;font-size:14px;white-space:nowrap}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#dock{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;align-items:center;gap:12px;padding:0 12px calc(env(safe-area-inset-bottom,0px) + 16px)}
.side{background:var(--glass);border:1px solid var(--line);border-radius:16px;height:56px;padding:0 16px;font-family:var(--font-display);font-size:14px;backdrop-filter:blur(6px)}
.main{flex:1;max-width:260px;height:68px;border-radius:22px;font-family:var(--font-display);font-size:21px;letter-spacing:.04em;color:#3a2300;background:linear-gradient(180deg,#ffd36b,var(--sun));box-shadow:0 6px 0 #b5700c,0 10px 24px rgba(0,0,0,.4);transition:transform .08s,box-shadow .08s,filter .2s}
.main:active,.main.down{transform:translateY(4px);box-shadow:0 2px 0 #b5700c,0 6px 16px rgba(0,0,0,.4)}
.main[disabled]{filter:grayscale(.7) brightness(.7)}
.main.alert{background:linear-gradient(180deg,#ff8a7a,var(--bad));color:#fff;box-shadow:0 6px 0 #a02a1e,0 10px 24px rgba(0,0,0,.4);animation:pulse .35s infinite alternate}
@keyframes pulse{to{transform:scale(1.06)}}
.sheet{position:fixed;inset:0;background:rgba(3,14,24,.62);display:flex;align-items:flex-end;justify-content:center;touch-action:pan-y}
.sheet .box{width:min(100%,640px);max-height:86%;background:linear-gradient(180deg,#123f5e,#0b2a40);border:1px solid var(--line);border-radius:22px 22px 0 0;display:flex;flex-direction:column;min-height:0;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;font-family:var(--font-display);font-size:19px;border-bottom:1px solid var(--line)}
.sheet header button{background:rgba(255,255,255,.1);border-radius:12px;width:40px;height:40px;font-size:18px}
.sheet .body{overflow:auto;padding:12px 14px 18px;display:grid;gap:10px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.rod{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 12px;align-items:center;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.rod.cur{border-color:var(--sun);background:rgba(255,176,46,.12)}
.rod .sw{width:10px;height:54px;border-radius:6px;grid-row:1/3}
.rod h4{margin:0;font-family:var(--font-display);font-weight:400;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rod .st{font-size:12px;opacity:.85;grid-column:2}
.rod .act{grid-column:3;grid-row:1/3;display:grid;gap:6px;justify-items:stretch}
.rod .act button{border-radius:10px;padding:7px 10px;font-size:13px;font-weight:800;background:var(--sun);color:#3a2300;white-space:nowrap}
.rod .act button.alt{background:rgba(255,255,255,.14);color:var(--foam)}
.rod .act button[disabled]{opacity:.4}
.pips{grid-column:2/4;display:grid;grid-template-columns:repeat(20,1fr);gap:2px}
.pips i{height:5px;border-radius:2px;background:rgba(255,255,255,.14)}
.pips i.on{background:var(--sun)}
.row{display:grid;gap:6px}
.row label{display:flex;justify-content:space-between;font-size:14px}
.row output{color:var(--sun);font-family:var(--font-display);font-size:13px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.seg button{background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:10px;padding:9px 4px;font-size:13px;font-weight:800}
.seg button.on{background:var(--sun);color:#3a2300;border-color:var(--sun)}
input[type=range]{width:100%;accent-color:var(--sun)}
.tg{display:flex;justify-content:space-between;align-items:center;font-size:14px}
.tg input{width:22px;height:22px;accent-color:var(--sun)}
#fps{font-size:12px;padding:4px 10px}
#nogl{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px;background:var(--ink)}
</style>

<canvas id="c"></canvas>

<div id="hud">

</div>
<div id="catchline"></div>

</div>

<div id="card" hidden><b id="cName"></b><span id="cInfo"></span><em id="cVal"></em></div>
<div id="toast"></div>

<div id="dock">
  <button class="side" id="bShop">Вудки</button>
  <button class="main" id="act">ЗАКИНУТИ</button>

</div>

<section class="sheet" id="shop" hidden>

    <div class="body" id="shopBody"></div>
  </div>
</section>

<section class="sheet" id="gfx" hidden>
  <div class="box">
    <header><span>Налаштування графіки</span><button id="gfxX" aria-label="Закрити">✕</button></header>
    <div class="body">
      <div class="row"><label>Якість</label>
        <div class="seg" id="segPreset"><button data-p="low">Низька</button><button data-p="med">Середня</button><button data-p="high">Висока</button><button data-p="ultra">Ультра</button></div></div>
      <div class="row"><label for="gRes">Роздільність <output id="oRes"></output></label><input type="range" id="gRes" min="0.5" max="1.8" step="0.05"></div>
      <div class="row"><label>Тіні</label>
        <div class="seg" id="segShadow"><button data-s="0">Вимк</button><button data-s="1024">Низькі</button><button data-s="2048">Високі</button><button data-s="4096">Ультра</button></div></div>
      <div class="row"><label for="gWater">Деталі води <output id="oWater"></output></label><input type="range" id="gWater" min="16" max="110" step="2"></div>
      <div class="row"><label for="gTrees">Дерева <output id="oTrees"></output></label><input type="range" id="gTrees" min="0" max="90" step="2"></div>
      <div class="row"><label for="gFog">Дальність видимості <output id="oFog"></output></label><input type="range" id="gFog" min="60" max="300" step="10"></div>
      <label class="tg" for="gPart">Бризки та хвилі<input type="checkbox" id="gPart"></label>
      <label class="tg" for="gFps">Показувати FPS<input type="checkbox" id="gFps"></label>
      <div class="row"><label>Час доби</label>
        <div class="seg" id="segSky"><button data-k="day">День</button><button data-k="sunset">Захід</button><button data-k="night">Ніч</button></div></div>
    </div>
  </div>
</section>

function applyGfx(){
  renderer.setPixelRatio(Math.min(window.devicePixelRatio*G.res,3));
  renderer.setSize(window.innerWidth,window.innerHeight,false);
  camera.aspect=window.innerWidth/window.innerHeight;camera.fov=camera.aspect<1?72:55;camera.updateProjectionMatrix();
  var sh=!!G.shadows;
  if(renderer.shadowMap.enabled!==sh){renderer.shadowMap.enabled=sh;scene.traverse(function(o){if(o.material){(Array.isArray(o.material)?o.material:[o.material]).forEach(function(m){m.needsUpdate=true})}})}
  sun.castShadow=sh;
  if(sh&&sun.shadow.mapSize.x!==G.shadows){sun.shadow.mapSize.set(G.shadows,G.shadows);if(sun.shadow.map){sun.shadow.map.dispose();sun.shadow.map=null}}
  scene.fog.far=G.fog;
  if(!water||water.geometry.parameters.widthSegments!==G.water)rebuildWater(G.water);
  if(!treeGroup||treeGroup.userData.n!==G.trees){rebuildTrees(G.trees);treeGroup.userData.n=G.trees;}
  if(!G.particles){rings.forEach(function(r){r.visible=false});drops.forEach(function(d){d.visible=false})}
  $('fps').hidden=!S.showFps;
}
function syncGfxUi(){
  document.querySelectorAll('#segPreset button').forEach(function(b){b.classList.toggle('on',b.dataset.p===G.preset)});
  document.querySelectorAll('#segShadow button').forEach(function(b){b.classList.toggle('on',+b.dataset.s===G.shadows)});
  $('gRes').value=G.res;$('oRes').textContent=Math.round(G.res*100)+'%';
  $('gWater').value=G.water;$('oWater').textContent=G.water;
  $('gTrees').value=G.trees;$('oTrees').textContent=G.trees;
  $('gFog').value=G.fog;$('oFog').textContent=G.fog+' м';
  $('gPart').checked=!!G.particles;$('gFps').checked=!!S.showFps;
  document.querySelectorAll('#segSky button').forEach(function(b){b.classList.toggle('on',b.dataset.k===S.sky)});
}
function custom(){G.preset='custom';applyGfx();syncGfxUi();persist();}
document.querySelectorAll('#segPreset button').forEach(function(b){b.onclick=function(){var p=PRESETS[b.dataset.p];Object.assign(G,p);G.preset=b.dataset.p;applyGfx();syncGfxUi();persist();}});
document.querySelectorAll('#segShadow button').forEach(function(b){b.onclick=function(){G.shadows=+b.dataset.s;custom();}});
document.querySelectorAll('#segSky button').forEach(function(b){b.onclick=function(){setSky(b.dataset.k);persist();}});

var arm={th:-1.15,el:-.6,pitch:1,bend:0,lth:-.8};
var blink={h:{t:2,u:-1},f:{t:3,u:-1}};
var foxJump=0,shake=0;

function curRod(){return RODS[S.cur]}
function P(){return power(S.cur,S.lvl[S.cur])}
function fmtW(w){return w<1?Math.round(w*1000)+' г':w.toFixed(1)+' кг'}
function toast(msg){var el=$('toast');el.textContent=msg;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){el.classList.remove('on')},1900)}
function hudUpdate(){
  $('coins').textContent=S.coins.toLocaleString('uk-UA');
  $('rodname').textContent=curRod().name;$('rodlvl').textContent='Рів. '+S.lvl[S.cur];
  $('catchline').textContent=S.caught?('Спіймано: '+S.caught+(S.bestN?' · рекорд: '+S.bestN+' '+fmtW(S.bestW):'')):'Тисни «Закинути»';
}
function setAct(txt,disabled,alert){var b=$('act');b.textContent=txt;b.disabled=!!disabled;b.classList.toggle('alert',!!alert)}

function pickFish(){
  var Pw=P(),L=luck(S.cur,S.lvl[S.cur]),tot=0;
  var ws=FISH.map(function(f){var z=Math.log(f.d/(Pw*1.1));var w=Math.exp(-z*z/(2*.64))*RW[f.rar]*(1+(L-1)*f.rar*.8);tot+=w;return w});
  var r=Math.random()*tot,f=FISH[0];
  for(var i=0;i<FISH.length;i++){r-=ws[i];if(r<=0){f=FISH[i];break}}
  var k=Math.pow(Math.random(),1.6);
  return {f:f,k:k,w:lerp(f.w[0],f.w[1],k),value:Math.round(f.p*(.6+.8*k)),d:f.d*(.85+.4*k)};
}

function startCast(){
  st='cast';castT=0;released=false;setAct('…',true);
  var dist=range(S.cur,S.lvl[S.cur]);
  target.set(human.position.x+rnd(-3,3),0,-dist);
}
function startFight(){
  st='fight';var Pw=P();
  F.tension=30;F.prog=35;F.pull=clamp(cur.d/Pw,.12,1.5);F.ratio=clamp(Pw/cur.d,.5,2.5);F.surge=0;F.next=rnd(1.2,2.4);F.ph=rnd(0,6);
  $('fight').hidden=false;setAct('ТЯГНУТИ',false,false);
  splash(bobPos,10);
}
function endFight(){$('fight').hidden=true;hold=false;$('act').classList.remove('down')}
function toIdle(){st='idle';cur=null;endFight();setAct('ЗАКИНУТИ',false,false)}
function win(){
  endFight();st='reveal';revT=0;
  S.coins+=cur.value;S.caught++;
  if(cur.w>S.bestW){S.bestW=cur.w;S.bestN=cur.f.n}
  persist();hudUpdate();
  var sc=.5+cur.f.d*.012+cur.k*.3;
  flyFish=makeFish(cur.f.c,sc);revFrom.copy(bobPos);flyFish.position.copy(bobPos);scene.add(flyFish);
  $('cName').textContent=cur.f.n;$('cInfo').textContent=fmtW(cur.w)+' · '+RARN[cur.f.rar];$('cVal').textContent='+'+cur.value+' монет';
  $('card').hidden=true;setAct('ДАЛІ',false,false);foxJump=1.6;
  try{navigator.vibrate&&navigator.vibrate(40)}catch(e){}
}
function endReveal(){if(flyFish){scene.remove(flyFish);flyFish=null}$('card').hidden=true;toIdle()}

function actDown(){
  if(st==='idle')startCast();
  else if(st==='wait'){toast('Ви підтягли волосінь');toIdle()}
  else if(st==='bite')startFight();
  else if(st==='fight'){hold=true;$('act').classList.add('down')}
  else if(st==='reveal'&&revT>1.2)endReveal();
}
function actUp(){if(st==='fight'){hold=false}$('act').classList.remove('down')}
var actB=$('act');
actB.addEventListener('pointerdown',function(e){e.preventDefault();actDown()});
['pointerup','pointerleave','pointercancel'].forEach(function(n){actB.addEventListener(n,actUp)});
window.addEventListener('keydown',function(e){if(e.code==='Space'&&!e.repeat){e.preventDefault();actDown()}});
window.addEventListener('keyup',function(e){if(e.code==='Space')actUp()});

/* ================= МАГАЗИН ================= */
function renderShop(){
  var h='';
  RODS.forEach(function(r,i){
    var own=S.owned[i],l=S.lvl[i],isCur=S.cur===i,col='#'+rodColor(i).getHexString();
    var st1='Сила '+power(i,l).toFixed(1)+' · Удача '+luck(i,l).toFixed(2)+' · Дальність '+range(i,l).toFixed(1)+' м';
    var pips='';for(var k=1;k<=MAXLVL;k++)pips+='<i'+(own&&k<=l?' class="on"':'')+'></i>';
    var btns='';
    if(!own)btns='<button data-buy="'+i+'"'+(S.coins<r.price?' disabled':'')+'>Купити '+r.price.toLocaleString('uk-UA')+'</button>';
    else{
      btns+=isCur?'<button class="alt" disabled>Обрана</button>':'<button class="alt" data-sel="'+i+'">Обрати</button>';
      btns+=l>=MAXLVL?'<button disabled>Макс. рівень</button>':'<button data-up="'+i+'"'+(S.coins<upCost(i,l)?' disabled':'')+'>Рів. '+(l+1)+' · '+upCost(i,l).toLocaleString('uk-UA')+'</button>';
    }
    h+='<div class="rod'+(isCur?' cur':'')+'"><span class="sw" style="background:'+col+'"></span><h4>'+(i+1)+'. '+r.name+'</h4><div class="act">'+btns+'</div><div class="st">'+(own?st1+' · рів. '+l+'/20':'Ціна '+r.price.toLocaleString('uk-UA')+' монет')+'</div><div class="pips">'+pips+'</div></div>';
  });
  $('shopBody').innerHTML=h;
}
$('shopBody').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b||b.disabled)return;
  var sc=$('shopBody').scrollTop;
  if(b.dataset.buy){var i=+b.dataset.buy;if(S.coins>=RODS[i].price){S.coins-=RODS[i].price;S.owned[i]=true;S.cur=i;buildRod(i,S.lvl[i]);toast('Куплено: '+RODS[i].name)}}
  else if(b.dataset.sel){S.cur=+b.dataset.sel;buildRod(S.cur,S.lvl[S.cur])}
  else if(b.dataset.up){var j=+b.dataset.up,c=upCost(j,S.lvl[j]);if(S.lvl[j]<MAXLVL&&S.coins>=c){S.coins-=c;S.lvl[j]++;if(S.cur===j)buildRod(j,S.lvl[j]);toast(RODS[j].name+' → рівень '+S.lvl[j])}}
  persist();hudUpdate();renderShop();$('shopBody').scrollTop=sc;
});
function openSheet(id){$(id).hidden=false;if(id==='shop')renderShop();if(id==='gfx')syncGfxUi()}
$('bShop').onclick=function(){openSheet('shop')};$('bGfx').onclick=function(){openSheet('gfx')};
$('shopX').onclick=function(){$('shop').hidden=true};$('gfxX').onclick=function(){$('gfx').hidden=true};
['shop','gfx'].forEach(function(id){$(id).addEventListener('pointerdown',function(e){if(e.target===$(id))$(id).hidden=true})});
['bShop','bGfx','shopX','gfxX'].forEach(function(id){$(id).addEventListener('pointerdown',function(e){e.stopPropagation()})});

/* камера: перетягування */
var yaw=0,camH=0,drag=null;
var cv=$('c');
cv.addEventListener('pointerdown',function(e){drag={x:e.clientX,y:e.clientY};cv.setPointerCapture&&cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',function(e){if(!drag)return;yaw=clamp(yaw-(e.clientX-drag.x)*.005,-.9,.9);camH=clamp(camH+(e.clientY-drag.y)*.01,-1,2);drag.x=e.clientX;drag.y=e.clientY});
['pointerup','pointercancel'].forEach(function(n){cv.addEventListener(n,function(){drag=null})});

/* ================= ГОЛОВНИЙ ЦИКЛ ================= */
var last=performance.now(),fpsAcc=0,fpsN=0;
var tmpV=new THREE.Vector3(),tmpQ=new THREE.Quaternion(),qx=new THREE.Quaternion(),xAxis=new THREE.Vector3(1,0,0);
function lookAngle(from,tx,tz,baseYaw){return wrapA(Math.atan2(tx-from.x,tz-from.z)-baseYaw)}
function doBlink(b,eyes,dt){
  b.t-=dt;if(b.t<=0&&b.u<0){b.u=0;b.t=rnd(1.6,4.5)}
  var s=1;if(b.u>=0){b.u+=dt/.16;if(b.u>=1){b.u=-1}else s=1-Math.sin(Math.PI*b.u)*.92}
  eyes.forEach(function(e){e.scale.y=s});
}

function frame(now){
  requestAnimationFrame(frame);
  var dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;
  fpsAcc+=dt;fpsN++;if(fpsAcc>=.5){if(S.showFps)$('fps').textContent=Math.round(fpsN/fpsAcc)+' FPS';fpsAcc=0;fpsN=0}

  /* --- стан гри --- */
  var tgt={th:-1.15,el:-.6,pitch:1,bend:0},sag=.12,hang=false;
  if(st==='idle'||st==='reveal'){hang=true}
  else if(st==='cast'){
    castT+=dt;
    if(castT<.5){tgt={th:.6,el:-.3,pitch:-.55,bend:-.1};hang=true}
    else{
      tgt={th:-1.5,el:-.2,pitch:1.25,bend:.25};
      if(!released){released=true;flightT=0;rod.tip.getWorldPosition(flightFrom);}
      flightT+=dt/.9;var u=Math.min(1,flightT);
      bobPos.lerpVectors(flightFrom,target,u);bobPos.y+=Math.sin(Math.PI*u)*3.4;sag=.05;
      if(u>=1){bobPos.y=0;splash(target,14);st='wait';waitT=rnd(2.2,5.5)*waitMul(S.cur,S.lvl[S.cur]);nibT=rnd(.8,1.6);setAct('ПІДТЯГНУТИ',false,false);}
    }
  }
  else if(st==='wait'){
    waitT-=dt;nibT-=dt;sag=.3;
    bobPos.set(target.x,waveH(target.x,target.z,t)+Math.sin(t*3)*.02,target.z);
    if(nibT<=0){nibT=rnd(.9,2);bobPos.y-=.12;ripple(target.x,target.z,.7)}
    if(waitT<=0){st='bite';biteT=1.4;cur=pickFish();setAct('ПІДСІКАЙ!',false,true);splash(bobPos,8);toast('Клює!');try{navigator.vibrate&&navigator.vibrate([60,40,60])}catch(e){}}
  }
  else if(st==='bite'){
    biteT-=dt;sag=.3;tgt.bend=.15;
    bobPos.set(target.x+Math.sin(t*30)*.04,waveH(target.x,target.z,t)-.1-Math.abs(Math.sin(t*9))*.12,target.z);
    if(biteT<=0){toast('Рибка втекла…');toIdle()}
  }
  else if(st==='fight'){
    F.surge=Math.max(0,F.surge-dt);F.next-=dt;
    if(F.next<=0){F.surge=.75;F.next=rnd(1.8,3.4)}
    var wave=.55+.45*Math.sin(t*2.2+F.ph),sm=F.surge>0?1.9:1,pull=F.pull*wave*sm;
    if(hold){
      F.tension+=(14+pull*42)*dt;
      F.prog+=26*F.ratio*dt*(F.tension<80?1:.35);
    }else{
      F.tension-=38*dt;
      F.prog-=(1+pull*2.5)*dt;
    }
    F.tension=clamp(F.tension,0,110);
    var fm=$('fightmsg');
    if(F.surge>0){fm.textContent='РВЕ! Відпусти!';fm.classList.add('surge')}
    else{fm.classList.remove('surge');fm.textContent=F.tension>=80?'Небезпечно!':(hold?'Тягни!':'Тримай і тягни')}
    $('tfill').style.width=(F.tension/110*100)+'%';$('pfill').style.width=clamp(F.prog,0,100)+'%';
    var pr=clamp(F.prog/100,0,1);
    var bx=lerp(target.x,human.position.x,pr*.92)+Math.sin(t*1.3+F.ph)*(1-pr)*2.2*(F.surge>0?1.6:1);
    var bz=lerp(target.z,-2,pr*.92)+Math.cos(t*1.7)*(1-pr)*1.3;
    bobPos.set(bx,waveH(bx,bz,t)-.04+Math.abs(Math.sin(t*7))*.04,bz);
    shadow.position.set(bx,.04,bz);shadow.visible=true;shadow.scale.setScalar(.8+cur.f.d*.015);
    if(Math.random()<dt*6)ripple(bx+rnd(-.4,.4),bz+rnd(-.4,.4),.6);
    tgt={th:-1.1+Math.sin(t*12)*.04*(F.tension/100),el:-.5,pitch:.8,bend:.2+F.tension/110*.55};
    sag=.02;shake=F.tension/110*.04;
    if(F.tension>=100){toast('Волосінь порвалась!');toIdle()}
    else if(F.prog>=100){win()}
    else if(F.prog<=0){toast('Риба втекла…');toIdle()}
  }
  if(st!=='fight')shadow.visible=false;
  if(st==='reveal'){
    revT+=dt;hang=false;
    var tipW=new THREE.Vector3();rod.tip.getWorldPosition(tipW);
    var hov=new THREE.Vector3(human.position.x,3.5,human.position.z-.4);
    if(flyFish){
      if(revT<1.1){var u2=revT/1.1;flyFish.position.lerpVectors(revFrom,hov,u2);flyFish.position.y+=Math.sin(Math.PI*u2)*1.6;flyFish.rotation.z=-u2*.4;flyFish.rotation.y=u2*Math.PI*2;bobPos.copy(flyFish.position);}
      else{flyFish.position.copy(hov);flyFish.position.y+=Math.sin(t*3)*.08;flyFish.rotation.y+=dt*1.6;bobPos.copy(flyFish.position);if($('card').hidden)$('card').hidden=false;}
    }
    tgt={th:-1.5,el:-.2,pitch:1.1,bend:0};
    if(revT>3.4)endReveal();
  }
  /* поза */
  var k=Math.min(1,dt*10);
  arm.th+=(tgt.th-arm.th)*k;arm.el+=(tgt.el-arm.el)*k;arm.pitch+=(tgt.pitch-arm.pitch)*k;arm.bend+=(tgt.bend-arm.bend)*Math.min(1,dt*8);
  HP.armR.sh.rotation.x=arm.th;HP.armR.sh.rotation.z=-.12;HP.armR.el.rotation.x=arm.el;
  var lt=st==='cast'?(castT<.5?-.2:-1.2):-.8;arm.lth+=(lt-arm.lth)*k;
  HP.armL.sh.rotation.x=arm.lth;HP.armL.sh.rotation.z=.12;HP.armL.el.rotation.x=-.9;
  HP.torso.scale.y=1+Math.sin(t*1.8)*.012;
  HP.torso.rotation.y=st==='cast'?(castT<.5?.35:-.25):0;
  var sway=Math.sin(t*1.2)*.01;
  human.position.y=.86;

  /* вудка в руці */
  human.updateMatrixWorld(true);HP.armR.hand.getWorldPosition(handPos);
  rod.g.position.copy(handPos);
  human.getWorldQuaternion(tmpQ);qx.setFromAxisAngle(xAxis,arm.pitch+sway);rod.g.quaternion.copy(tmpQ).multiply(qx);
  rod.p[0].rotation.x=arm.bend*.2;rod.p[1].rotation.x=arm.bend*.35;rod.p[2].rotation.x=arm.bend*.45;
  rod.g.updateMatrixWorld(true);rod.tip.getWorldPosition(tipPos);
  if(hang){tmpV.set(tipPos.x+Math.sin(t*1.7)*.05,tipPos.y-.75,tipPos.z+.05);bobPos.lerp(tmpV,Math.min(1,dt*(st==='idle'?6:30)));sag=.05}
  bobber.position.copy(bobPos);bobber.position.y+=.06;
  bobber.visible=true;
  /* волосінь */
  var la=lineGeo.attributes.position.array;
  for(var i=0;i<LN;i++){var u3=i/(LN-1);la[i*3]=lerp(tipPos.x,bobPos.x,u3);la[i*3+1]=lerp(tipPos.y,bobPos.y+.15,u3)-Math.sin(Math.PI*u3)*sag*Math.max(.3,Math.abs(tipPos.z-bobPos.z)*.15);la[i*3+2]=lerp(tipPos.z,bobPos.z,u3);}
  lineGeo.attributes.position.needsUpdate=true;

  /* голова людини та лис */
  var ha=lookAngle(human.position,bobPos.x,bobPos.z,Math.PI);
  HP.head.rotation.y+=(clamp(ha,-.8,.8)-HP.head.rotation.y)*Math.min(1,dt*4);
  HP.head.rotation.x=st==='bite'||st==='fight'?.12:.0;
  doBlink(blink.h,HP.eyes,dt);doBlink(blink.f,FP.eyes,dt);
  var fa=lookAngle(fox.position,bobPos.x,bobPos.z,fox.rotation.y);
  FP.head.rotation.y+=(clamp(fa,-.9,.9)-FP.head.rotation.y)*Math.min(1,dt*3);
  FP.head.rotation.x=(st==='bite'||st==='fight')?-.1:.05;
  var wag=(st==='bite'||st==='fight'||st==='reveal')?14:4;
  FP.tail.rotation.y=Math.sin(t*wag)*(wag>5?.55:.3);
  foxJump=Math.max(0,foxJump-dt*1.2);
  fox.position.y=.86+Math.abs(Math.sin(t*9))*.3*Math.min(1,foxJump);
  fox.rotation.z=st==='bite'?Math.sin(t*20)*.04:0;

  /* вода, хмари, частинки */
  updateWater(t);
  clouds.forEach(function(c){c.position.x+=c.userData.v*dt;if(c.position.x>280)c.position.x=-280});
  rings.forEach(function(r){if(!r.visible)return;var d=r.userData;d.life+=dt;var u4=d.life/d.max;if(u4>=1){r.visible=false;return}r.scale.setScalar((.4+u4*3.6)*d.sz);r.material.opacity=(1-u4)*.7});
  drops.forEach(function(d){if(!d.visible)return;var v=d.userData.v;v.y-=9*dt;d.position.addScaledVector(v,dt);d.userData.life-=dt*1.1;if(d.position.y<0||d.userData.life<=0)d.visible=false});
  if(st==='wait'&&Math.random()<dt*.5)ripple(target.x+rnd(-1,1),target.z+rnd(-1,1),.5);

  /* камера */
  var base=camera.aspect<1?new THREE.Vector3(3.2,2.9+camH,6.6):new THREE.Vector3(3,2.6+camH,5.4);
  var piv=new THREE.Vector3(.3,0,0);
  base.applyAxisAngle(new THREE.Vector3(0,1,0),yaw);
  camera.position.copy(piv).add(base);
  camera.position.x+=Math.sin(t*.4)*.06+(Math.random()-.5)*shake;camera.position.y+=(Math.random()-.5)*shake;
  camera.lookAt(.2,1.5,-3.2);
  skyGroup.position.copy(camera.position);
  renderer.render(scene,camera);
}

/* ================= СТАРТ ================= */
buildRod(S.cur,S.lvl[S.cur]);
applyGfx();setSky(S.sky);syncGfxUi();hudUpdate();setAct('ЗАКИНУТИ',false,false);
requestAnimationFrame(function(n){last=n;frame(n)});
})();
</script>

</body></html>
